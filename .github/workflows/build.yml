name: Build APK

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Build
        run: ./gradlew assembleDebug assembleRelease --no-daemon
      - name: Version & rename APK
        id: ver
        run: |
          V=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          echo "tag=v$V" >> "$GITHUB_OUTPUT"
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk out/DynamicIsland-v$V.apk
          cp app/build/outputs/apk/debug/app-debug.apk out/DynamicIsland-v$V-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: DynamicIsland-apk
          path: out/*.apk
      - name: Publish release
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Dynamic Island ${{ steps.ver.outputs.tag }}
          make_latest: true
          files: out/*.apk
          generate_release_notes: true
          body: |
            ## Cara pasang
            1. Unduh **DynamicIsland-${{ steps.ver.outputs.tag }}.apk** di bawah lalu pasang.
            2. Buka aplikasi, aktifkan **Layanan aksesibilitas** dan **Akses notifikasi**.
            3. Android 13+: jika aksesibilitas abu-abu → Info aplikasi → ⋮ → *Izinkan setelan terbatas*.
            4. Tekan **Sejajarkan ke kamera**, lalu atur sesukamu.

            Versi `-debug.apk` hanya untuk keperluan debugging.
