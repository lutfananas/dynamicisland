name: Build APK

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Build
        run: ./gradlew assembleDebug assembleRelease --no-daemon
      - name: Rename APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk out/DynamicIsland-${GITHUB_REF_NAME//\//-}.apk
          cp app/build/outputs/apk/debug/app-debug.apk out/DynamicIsland-${GITHUB_REF_NAME//\//-}-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: DynamicIsland-apk
          path: out/*.apk
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: Dynamic Island ${{ github.ref_name }}
          files: out/*.apk
          generate_release_notes: true
          body: |
            ## Cara pasang
            1. Unduh **DynamicIsland-${{ github.ref_name }}.apk** di bawah lalu pasang.
            2. Buka aplikasi, aktifkan **Layanan aksesibilitas** dan **Akses notifikasi**.
            3. Android 13+: jika aksesibilitas abu-abu → Info aplikasi → ⋮ → *Izinkan setelan terbatas*.
            4. Tekan **Sejajarkan ke kamera**, lalu atur sesukamu.

            Versi `-debug.apk` hanya untuk keperluan debugging.
